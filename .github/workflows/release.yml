name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview version and Release Notes only, not actually released
        type: boolean
        default: false
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'release') || startsWith(github.event.head_commit.message, 'Release'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npx --yes semantic-release@25.0.9 --dry-run
          else
            npx --yes semantic-release@25.0.9
          fi
